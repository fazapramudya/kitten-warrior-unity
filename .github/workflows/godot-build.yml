name: Build Godot 4 Game (Windows Standalone)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'godot-project/**'
      - '.github/workflows/godot-build.yml'

jobs:
  export-windows:
    name: Build Godot 4 Windows x64 (.EXE)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot || true
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable || true

      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          cd godot-project
          godot --headless --export-release "Windows Desktop" "../build/windows/KittenWarrior.exe"

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittenWarrior-Godot-Windows-x64
          path: build/windows
          retention-days: 14
