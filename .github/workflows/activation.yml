name: Acquire Unity Activation License File (.alf)

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request Unity .alf File
    runs-on: ubuntu-latest

    steps:
      - name: Request manual activation file (.alf)
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2022.3.20f1

      - name: Expose as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v2022.3.20f1.alf
          path: '**/*.alf'
          retention-days: 7
