name: Build Desktop Windows (.EXE)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop-app/**'
      - 'web-prototype/**'
      - '.github/workflows/desktop-build.yml'

jobs:
  build-windows-exe:
    name: Package Windows x64 .EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package with Electron Packager
        shell: bash
        run: |
          cd desktop-app
          npx --yes @electron/packager . "KittenWarrior" --platform=win32 --arch=x64 --electron-version=33.2.1 --out=dist --overwrite
          cd dist
          powershell -Command "Compress-Archive -Path 'KittenWarrior-win32-x64' -DestinationPath 'KittenWarrior-Windows-x64.zip' -Force"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittenWarrior-Windows-x64
          path: desktop-app/dist/KittenWarrior-Windows-x64.zip
          retention-days: 14
